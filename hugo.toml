baseURL = "https://quanpu.wang/"
locale = "zh-cn"
defaultContentLanguage = "zh"
# 关键：Hugo 默认按 UTC 解析不带时间的 date。
# 北京时间凌晨写 date: YYYY-MM-DD 会被判成"未来"而跳过渲染（文章 404）。
timeZone = "Asia/Shanghai"
title = "幻域 · 渲染笔记"
theme = "PaperMod"
publishDir = "docs"
enableRobotsTXT = true
pagination.pagerSize = 10

# 首页额外输出 JSON 索引 —— PaperMod 的搜索页要用
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 允许正文里直接写 HTML —— 以后要嵌 WASM 渲染器 demo / iframe 时需要
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  # 让 LaTeX 公式原样穿过 Markdown 解析。
  # 不配这个的话，$M^{-\mathsf T}$ 里的 _ ^ \ 会被 Markdown 当成语法处理，公式直接坏掉。
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false
    style = "monokai"
    lineNos = false

[params]
  author = "Froler27"
  description = "实时渲染 / 图形学 / 跨平台工程的笔记与实验"
  keywords = ["实时渲染", "图形学", "GPU", "Vulkan", "Shader", "渲染管线"]
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  comments = false

  # 首页 Hero 文案（layouts/index.html 读取）。留空会回退到内置文案。
  [params.hero]
    kicker = "RENDERING NOTES · 实时渲染 / 图形学 / 跨平台"
    kickerShort = "实时渲染 / 图形学 / 跨平台"
    lead = "把光线、几何与性能算清楚——读论文、读引擎源码、写渲染器，然后把想清楚的东西说清楚。"
    primaryText = "进入笔记"
    primaryURL = "/posts/"
    secondaryText = "关于我"
    secondaryURL = "/about/"

  # 头部 logo —— PaperMod 把它渲染在站点名左边（label.icon）。
  # 放 assets/ 下走 resources.Get 资源处理；SVG 不参与缩放，按 iconHeight 显示。
  [params.label]
    icon = "images/logo.svg"
    iconHeight = 34

  [params.assets]
    disableHLJS = true
    # 重新开启 fingerprint（文件名带内容哈希），解决“新 HTML + 旧缓存 CSS”错配：
    # 带哈希的新文件名会强制浏览器重新拉取样式，不会等到缓存过期。
    # 之前关掉是因为 SRI 哈希与线上文件不一致：Hugo 用含 CRLF 的产物算哈希，
    # 而 git(autocrlf) 提交时把 CRLF 改写成 LF → 浏览器按 SRI 拒绝加载全部 CSS。
    # 现在 .gitattributes 里对 docs/** 关闭了换行转换，线上字节与构建时一致。
    disableFingerprinting = false

  [params.homeInfoParams]
    Title = "幻域 · 渲染笔记"
    Content = """
实时渲染、图形学与跨平台工程的笔记与实验。

读论文、读引擎源码、写渲染器——然后把想清楚的东西说清楚。
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Froler27"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "knowledge"
    name = "图谱"
    url = "/knowledge/"
    weight = 15
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 25
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 30
