baseURL = "https://froler27.github.io/"
locale = "zh-cn"
defaultContentLanguage = "zh"
# 关键：Hugo 默认按 UTC 解析不带时间的 date。
# 北京时间凌晨写 date: YYYY-MM-DD 会被判成"未来"而跳过渲染（文章 404）。
timeZone = "Asia/Shanghai"
title = "幻域 · 渲染笔记"
theme = "PaperMod"
publishDir = "docs"
enableRobotsTXT = true
pagination.pagerSize = 10

# 首页额外输出 JSON 索引 —— PaperMod 的搜索页要用
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 允许正文里直接写 HTML —— 以后要嵌 WASM 渲染器 demo / iframe 时需要
[markup]
  [markup.goldmark.renderer]
    unsafe = true
  # 让 LaTeX 公式原样穿过 Markdown 解析。
  # 不配这个的话，$M^{-\mathsf T}$ 里的 _ ^ \ 会被 Markdown 当成语法处理，公式直接坏掉。
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      block = [['\[', '\]'], ['$$', '$$']]
      inline = [['\(', '\)'], ['$', '$']]
  [markup.highlight]
    noClasses = false
    style = "monokai"
    lineNos = false

[params]
  author = "Froler27"
  description = "实时渲染 / 图形学 / 跨平台工程的笔记与实验"
  keywords = ["实时渲染", "图形学", "GPU", "Vulkan", "Shader", "渲染管线"]
  DateFormat = "2006-01-02"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  comments = false

  # 头部 logo —— PaperMod 把它渲染在站点名左边（label.icon）。
  # 放 assets/ 下走 resources.Get 资源处理；SVG 不参与缩放，按 iconHeight 显示。
  [params.label]
    icon = "images/logo.svg"
    iconHeight = 34

  [params.assets]
    disableHLJS = true
    # 关掉 resource fingerprint。原因：PaperMod 的 CSS 源本身是 CRLF，Hugo 按含 CRLF 的
    # 产物算 integrity 哈希；而 git(autocrlf) 会剥掉 CR 存成 LF、GitHub Pages 也发 LF 版本
    # → 浏览器算出的哈希与 integrity 声明不符 → 按 SRI 规范**拒绝加载 CSS/JS**
    # → 页面退化成无样式裸 HTML（导航变项目符号列表、SVG 图标撑满屏幕）。
    disableFingerprinting = true

  [params.homeInfoParams]
    Title = "幻域 · 渲染笔记"
    Content = """
实时渲染、图形学与跨平台工程的笔记与实验。

读论文、读引擎源码、写渲染器——然后把想清楚的东西说清楚。
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/Froler27"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 25
  [[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 30
